<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis enlaces · Link in Bio</title>
    <meta name="description" content="Enlaces de la persona que has escaneado." />
    <meta name="theme-color" content="#e9eff6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1626" media="(prefers-color-scheme: dark)" />
    <!-- Inline icon: no extra request, and the CSP already allows `img-src data:`.
         Without it the browser asks for /favicon.ico and gets an error. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c1a2b'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2'%3E%3Crect x='5' y='5' width='9' height='9'/%3E%3Crect x='18' y='5' width='9' height='9'/%3E%3Crect x='5' y='18' width='9' height='9'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Crect x='8' y='8' width='3' height='3'/%3E%3Crect x='21' y='8' width='3' height='3'/%3E%3Crect x='8' y='21' width='3' height='3'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main>
      <header class="intro">
        <span class="mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <!-- Hidden until the script wires it: without JavaScript a dead button would
             only confuse. The page then follows the system theme by itself. -->
        <button type="button" class="theme-toggle" hidden aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
        </button>
        <h1>Mis enlaces Demo SDD con Kiro</h1>
      </header>
      <div id="content"></div>
    </main>
    <script type="module" src="/src/public/main.ts"></script>
  </body>
</html>
